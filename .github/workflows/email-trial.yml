name: email-trial

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/email-trial.yml

concurrency:
  group: arxiv-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies for Cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libcairo2-dev \
            python3-cairo \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev \
            libffi-dev \
            libjpeg-turbo8-dev \
            libpng-dev \
            libfreetype6-dev \
            pkg-config

      - name: Prep build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "meson>=1.4" "ninja>=1.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute Pages URL
        id: site
        run: |
          REPO="${GITHUB_REPOSITORY}"
          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"
          echo "url=https://${OWNER}.github.io/${NAME}/" >> "$GITHUB_OUTPUT"

      - name: Show LLM env
        env:
          DS_API_KEY: ${{ secrets.DS_API_KEY || secrets.DEEPSEEK_API_KEY || vars.DS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          print("DS_API_KEY:", "SET" if os.getenv("DS_API_KEY") else "MISSING")
          PY

      - name: Run tracker and send email
        env:
          DS_API_KEY: ${{ secrets.DS_API_KEY || secrets.DEEPSEEK_API_KEY || vars.DS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DS_API_KEY || vars.DEEPSEEK_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || vars.EMAIL_TO }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER || vars.EMAIL_SENDER }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ARXIV_MAX_ATTEMPTS: "6"
          ARXIV_PAUSE: "1.5"
        run: |
          python -m arxiv_tracker.cli run \
            --config config.yaml \
            --site-dir docs \
            --site-url "${{ steps.site.outputs.url }}" \
            --verbose

      - name: Commit changes to docs and state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update digest, site & dedup state"
          file_pattern: |
            docs/**
            outputs/**
            .state/**
