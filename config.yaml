categories: ["cs.LG", "cs.CL", "cs.AI", "cs.SE"]

# exclude_keywords: # 选择排除的关键词
#   - "Large Language Model"
#   - "LLM"

# 每个方向单独检索。分类与关键词之间仍是 logic（AND），组内关键词 OR。
groups:
  - name: "代码预训练"
    keywords:
      - "code pretraining"
      - "code pre-training"
      - "pretrained code model"
      - "code foundation model"
      - "continued pretraining for code"
  - name: "代码后训练"
    keywords:
      - "code post-training"
      - "post-training for code"
      - "code instruction tuning"
      - "instruction tuning for code"
      - "reinforcement learning for code generation"
      - "code preference optimization"
  - name: "代码Agent"
    keywords:
      - "coding agent"
      - "code agent"
      - "software engineering agent"
      - "agentic coding"
      - "SWE-bench"
      - "repository-level code agent"
  - name: "Agentic RL"
    keywords:
      - "agentic reinforcement learning"
      - "reinforcement learning for LLM agents"
      - "reinforcement learning for language model agents"
      - "LLM agent reinforcement learning"
      - "online reinforcement learning for agents"
      - "tool-use reinforcement learning"
      - "reinforcement learning with tool use"

logic: "AND"                 # 组间逻辑：categories 与 keywords 间 AND/OR
max_results: 15
sort_by: "lastUpdatedDate"  # 还可以是submittedDate 建议改成lastUpdatedDate按更新时间排，能捞到v2/v3的“新增”
sort_order: "descending"

# —— 摘要设置 ——
# mode: llm = 每篇论文一次大模型调用，产出中文标题、分类标签（架构/训练方法/应用场景/核心创新）
#             和结构化摘要（核心问题/关键困难/解决方案/主要结果/未来方向）
#       none / heuristic = 不调用大模型，只用摘要首句兜底
summary:
  mode: llm

insights:
  enabled: true
  workers: 8                          # 并发请求数
  cache_path: ".state/llm_cache.json" # 按 arXiv 基础 ID 缓存，v2/v3 与重跑不重复计费
  cache_days: 60                      # 缓存保留天数
  prompt_version: 1                   # 改 prompt 后 +1，旧缓存自动失效

# —— 邮件发送（QQ 邮箱） ——
email:
  enabled: true
  subject: "[arXiv] 代码方向日报"
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  smtp_pass_env: "SMTP_PASS"
  tls: "ssl"  # auto / ssl / starttls
  debug: false     # true 可打印 SMTP 调试日志
  detail: "full"  # simple = 只有表格行 / full = 表格行 + 问题/困难/方案/结果
  max_items: 30
  attach_md: true  # 是否开启Markdown附件
  attach_pdf: false  # 是否开启PDF附件

# —— LLM（DeepSeek，OpenAI 兼容） ——
# 谷时：北京时间除工作日 9:00–12:00、14:00–18:00 以外，含周末全天。Flash 闲时约为高峰价一半。
# Key 不要写在这个文件里。到 GitHub → Settings → Secrets and variables → Actions
# → New repository secret，名字填 DS_API_KEY，值填 DeepSeek 开放平台的 API Key。
# https://github.com/dekura/Arxiv-tracker/settings/secrets/actions/new
llm:
  provider: "openai-compatible"
  base_url: "https://api.deepseek.com"
  model: "deepseek-flash"
  api_key_env: "DS_API_KEY"
  # prompt 在 arxiv_tracker/insights.py，输出为严格 JSON（response_format=json_object）

site:
  enabled: true
  dir: "docs" 
  title: "arXiv 论文速递"
  keep_runs: 1024         # 历史保留期（按页面份数）
  theme: "light"        # "light" | "dark" | "auto"
  accent: "#2563eb"     # 主题色（可自定义）

freshness:
  since_days: 5              # 滚动 5 天。周末 arXiv 不发公告，定时任务又常在美东 20:00 公告前跑完；3 天窗口会把上一批整页滤空
  unique_only: true       # 开启跨天去重（见过的 arXiv ID 不再重复发）
  state_path: ".state/seen.json"  # 去重状态文件（会随 docs 一起提交保存）
  fallback_when_empty: false # 当今天无新增时，是否回退展示最近的Top若干（建议false）

scrape:
  html: true               # 先用 HTML 页抓链接
  pdf_if_missing: true     # 若没抓到 code，再去扫 PDF 头部兜底
  pdf_first_page: false    # （可保留为 false；若你想“不管有没有都扫 PDF”，设 true）
  timeout: 10
